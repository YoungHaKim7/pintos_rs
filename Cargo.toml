[package]
name = "pintos_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[dependencies]

[profile.dev]
panic = "abort"
debug = 2
# opt-level 1: near--O0 debuggability but with stack frames small
# enough for the C kernel's boot-stack budget (page 0, 4 kB).
opt-level = 1
lto = false

[profile.release]
panic = "abort"
debug = 2
opt-level = 2
